# bulk-count mirrors
# check/concord_bulk.c: three paced
# submits under one base name, then
# whole-set present.
name: bulk-count
version: 1
sut: concord
nodes: 3
timeout_s: 120
phases:
  - name: mesh
    until:
      mesh_count: 3
    timeout_s: 45
  - name: submit3
    do:
      - submit:
          node: 0
          image: probe
          as: bulk
          count: 3
          rate: 2
    until:
      mesh_count: 3
    timeout_s: 30
  - name: converged
    until:
      present:
        workload: bulk
        on: all
    timeout_s: 45
