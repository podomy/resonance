name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run checks
        run: make test

  strict:
    name: C23 Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # C-only jobs: every link line below is
      # $(CC) over C sources, so no setup-go
      # step. Go is needed only for img-build
      # and concord targets, avoided here.

      - name: C23 standard gate
        run: make standard

      - name: Strict builds
        run: |
          make bin/rsuite bin/parse_test bin/net_test bin/nemesis_test bin/exec_lint_test
          make bin/driver_concord_test bin/driver_weld_test bin/run_sample_test bin/sim_net_test bin/tun_stat_test bin/prog_test
          make bin/heap_test bin/node_test bin/world_test bin/determinism bin/mcast_test bin/tun_netns bin/tun_drop

      - name: Run unit tests
        run: ./bin/parse_test && ./bin/net_test && ./bin/nemesis_test && ./bin/exec_lint_test && ./bin/driver_concord_test && ./bin/driver_weld_test && ./bin/run_sample_test && ./bin/sim_net_test && ./bin/tun_stat_test && ./bin/prog_test

      - name: Run checks
        run: make test

      - name: Lint suites
        run: make lint

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz the parser
        run: make fuzzer

  build:
    name: Build Binaries
    needs: [verify, strict]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build binary
        run: |
          mkdir -p dist
          make
          cp bin/rsuite dist/rsuite-linux-amd64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsuite-linux-amd64
          path: dist/rsuite-linux-amd64
          retention-days: 30
